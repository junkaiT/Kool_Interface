<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoolAircon CRM</title>
<style>
 :root {
 --border: #d9dde2;
 --bg-panel: #ffffff;
 --bg-app: #f0f2f5;
 --bg-hover: #f5f6f7;
 --bg-active: #e9edf3;
 --text: #1b1f23;
 --text-dim: #667085;
 --accent: #2f6fed;
 --pill-lead: #7c3aed;
 --pill-customer: #16a34a;
 --pill-booked: #d97706;
 --unread-dot: #2f6fed;
 }
 * { box-sizing: border-box; }
 html, body {
 margin: 0; height: 100%; width: 100%;
 font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
 color: var(--text);
 background: var(--bg-app);
 }
 #app { display: flex; height: 100vh; width: 100vw; overflow: hidden; }
 #thread-col { width: 280px; flex: 0 0 280px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
 #thread-col.collapsed { display: none; }
 #thread-header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
 #thread-header h1 { font-size: 16px; margin: 0 0 8px 0; }
 #thread-search { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
 #thread-list { overflow-y: auto; flex: 1; }
 .thread-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0f1f3; }
 .thread-row:hover { background: var(--bg-hover); }
 .thread-row.active { background: var(--bg-active); }
 .avatar { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 14px; }
 .avatar.channel-telegram { background: #2f6fed; }
 .avatar.channel-whatsapp { background: #16a34a; }
 .thread-main { flex: 1; min-width: 0; }
 .thread-top-line { display: flex; justify-content: space-between; gap: 6px; }
 .thread-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
 .thread-time { font-size: 11px; color: var(--text-dim); flex: 0 0 auto; }
 .thread-bottom-line { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
 .thread-preview { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
 .thread-badges { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
 .pill { font-size: 10px; padding: 2px 7px; border-radius: 10px; color: #fff; white-space: nowrap; }
 .pill.channel-telegram { background: #2f6fed; }
 .pill.channel-whatsapp { background: #16a34a; }
 .pill.status-lead { background: var(--pill-lead); }
 .pill.status-customer { background: var(--pill-customer); }
 .pill.status-booked { background: var(--pill-booked); }
 .unread-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--unread-dot); flex: 0 0 auto; }
 #thread-empty { padding: 24px 14px; color: var(--text-dim); font-size: 13px; text-align: center; }
 #chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-app); }
 #chat-header { background: var(--bg-panel); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
 #chat-header .avatar { width: 34px; height: 34px; font-size: 13px; }
 #chat-header-info { flex: 1; min-width: 0; }
 #chat-header-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
 #chat-header-sub { font-size: 12px; color: var(--text-dim); }
 .icon-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
 .icon-btn:hover { background: var(--bg-hover); }
 .icon-btn.toggled { background: var(--bg-active); border-color: var(--accent); }
 #customer-panel { background: var(--bg-panel); border-bottom: 1px solid var(--border); display: none; padding: 14px 16px; gap: 20px; }
 #customer-panel.open { display: flex; }
 #customer-panel .col { flex: 1; font-size: 12.5px; }
 #customer-panel .col h3 { margin: 0 0 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
 #customer-panel .col div { margin-bottom: 3px; }
 #customer-panel .flag-yes { color: var(--pill-customer); }
 #customer-panel .flag-no { color: var(--text-dim); }
 #message-scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
 #chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }
 .bubble-row { display: flex; }
 .bubble-row.inbound { justify-content: flex-start; }
 .bubble-row.outbound { justify-content: flex-end; }
 .bubble { max-width: 68%; padding: 8px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.45; word-break: break-word; }
 .bubble.inbound { background: #fff; border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; }
 .bubble.outbound-direct { background: var(--accent); color: #fff; border-radius: 12px 2px 12px 12px; }
 .bubble.bot-command { background: #1b1f23; color: #d4d7dc; font-family: monospace; font-size: 12.5px; border-radius: 12px 2px 12px 12px; }
 .bubble.bot-response { background: #e9edf3; border-radius: 12px 2px 12px 12px; }
 .bubble-meta { font-size: 10.5px; margin-top: 3px; opacity: .6; }
 #compose-bar { background: var(--bg-panel); border-top: 1px solid var(--border); padding: 10px 16px; display: none; align-items: flex-end; gap: 10px; }
 #compose-input { flex: 1; resize: none; max-height: 120px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 13.5px; line-height: 1.4; }
 #compose-input:disabled { background: var(--bg-hover); color: var(--text-dim); }
 #compose-send { flex: 0 0 auto; padding: 8px 16px; border: none; border-radius: 8px; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; }
 #compose-send:disabled { background: var(--bg-active); color: var(--text-dim); cursor: default; }
 #compose-error { padding: 0 16px 8px; color: #c0392b; font-size: 12px; display: none; }
 #cal-col { width: 260px; flex: 0 0 260px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
 #cal-col.collapsed { display: none; }
 #cal-header { padding: 10px 12px 6px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
 #cal-month-label { flex: 1; font-weight: 600; font-size: 13px; }
 #cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; padding: 8px; }
 .cal-dow { font-size: 10px; text-align: center; color: var(--text-dim); padding: 2px 0; }
 .cal-day { font-size: 12px; text-align: center; padding: 5px 2px; border-radius: 5px; cursor: pointer; }
 .cal-day:hover { background: var(--bg-hover); }
 .cal-day.today { font-weight: 700; color: var(--accent); }
 .cal-day.selected { background: var(--accent); color: #fff; }
 .cal-day.empty { cursor: default; }
 #cal-jobs { flex: 1; overflow-y: auto; padding: 8px 12px; }
 #cal-jobs-heading { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); margin-bottom: 6px; }
 .cal-job { background: var(--bg-hover); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; font-size: 12px; }
 .cal-job-time { font-weight: 600; }
 .cal-job-team { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
 #cal-jobs-empty { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
 <div id="thread-col">
 <div id="thread-header">
 <h1>KoolAircon CRM</h1>
 <input id="thread-search" type="search" placeholder="Search conversations…">
 </div>
 <div id="thread-list"></div>
 <div id="thread-empty" style="display:none">No conversations yet.</div>
 </div>

 <div id="chat-col">
 <div id="chat-header">
 <div class="avatar channel-telegram" id="chat-avatar">–</div>
 <div id="chat-header-info">
 <div id="chat-header-name"><span id="chat-name">Select a conversation</span></div>
 <div id="chat-header-sub"></div>
 </div>
 <button class="icon-btn" id="toggle-customer-panel" title="Customer info">👤</button>
 <button class="icon-btn" id="toggle-cal-panel" title="Calendar">📅</button>
 </div>
 <div id="customer-panel">
 <div class="col" id="customer-col-jobs"><h3>Job History</h3></div>
 <div class="col" id="customer-col-household"><h3>Household</h3></div>
 <div class="col" id="customer-col-property"><h3>Property</h3></div>
 </div>
 <div id="message-scroll">
 <div id="chat-placeholder">← Select a conversation</div>
 </div>
 <div id="compose-error"></div>
 <div id="compose-bar">
 <textarea id="compose-input" rows="1" placeholder="Type a message…"></textarea>
 <button id="compose-send">Send</button>
 </div>
 </div>

 <div id="cal-col">
 <div id="cal-header">
 <button class="icon-btn" id="cal-prev">‹</button>
 <span id="cal-month-label"></span>
 <button class="icon-btn" id="cal-next">›</button>
 </div>
 <div id="cal-grid"></div>
 <div id="cal-jobs">
 <div id="cal-jobs-heading">Jobs</div>
 <div id="cal-jobs-list"><div id="cal-jobs-empty" style="color:var(--text-dim);font-size:12px">Select a date.</div></div>
 </div>
 </div>
</div>
<script>
(function () {
 var state = {
 threads: [],
 activeConversationId: null,
 calMonth: new Date(),
 calSelectedDate: null,
 lastUpdateSince: 0,
 };

 function el(tag, cls, text) {
 var e = document.createElement(tag);
 if (cls) e.className = cls;
 if (text != null) e.textContent = text;
 return e;
 }

 function fetchJson(path) {
 return fetch(path, { headers: { "ngrok-skip-browser-warning": "true" } })
 .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
 }

 function fmtTime(ts) {
 if (!ts) return "";
 var d = new Date(typeof ts === "number" ? ts : parseInt(ts, 10));
 var now = new Date();
 if (d.toDateString() === now.toDateString()) {
 return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
 }
 return d.toLocaleDateString([], { month: "short", day: "numeric" });
 }

 function initials(name) {
 if (!name) return "?";
 var parts = String(name).trim().split(/\s+/);
 return (parts[0][0] + (parts[1] ? parts[1][0] : "")).toUpperCase();
 }

 function loadThreads() {
 fetchJson("/api/threads").then(function (data) {
 state.threads = (data.threads || []).map(function (t) {
 return {
 conversationId: t.conversationId,
 contactId: t.contactId || null,
 name: t.name || t.conversationId,
 channel: t.channel || "telegram",
 status: t.status || "",
 lastText: t.lastText || "",
 lastDirection: t.lastDirection || "",
 lastTimestamp: t.lastTimestamp || 0,
 unreadCount: t.unreadCount || 0,
 };
 });
 renderThreadList();
 }).catch(function (err) {
 console.error("[ui] failed to load threads:", err);
 });
 }

 function renderThreadList() {
 var q = (document.getElementById("thread-search").value || "").toLowerCase();
 var list = document.getElementById("thread-list");
 var empty = document.getElementById("thread-empty");
 list.innerHTML = "";
 var filtered = state.threads.filter(function (t) {
 return !q || t.name.toLowerCase().includes(q) || (t.conversationId || "").toLowerCase().includes(q);
 });
 if (filtered.length === 0) { empty.style.display = ""; return; }
 empty.style.display = "none";
 filtered.forEach(function (t) {
 var row = el("div", "thread-row" + (t.conversationId === state.activeConversationId ? " active" : ""));
 var av = el("div", "avatar channel-" + t.channel, initials(t.name));
 row.appendChild(av);
 var main = el("div", "thread-main");
 var top = el("div", "thread-top-line");
 top.appendChild(el("span", "thread-name", t.name));
 top.appendChild(el("span", "thread-time", fmtTime(t.lastTimestamp)));
 main.appendChild(top);
 var bot = el("div", "thread-bottom-line");
 var preview = el("span", "thread-preview", (t.lastDirection === "outbound" ? "You: " : "") + (t.lastText || ""));
 bot.appendChild(preview);
 var badges = el("div", "thread-badges");
 if (t.status) badges.appendChild(el("span", "pill status-" + t.status.toLowerCase(), t.status));
 badges.appendChild(el("span", "pill channel-" + t.channel, t.channel));
 if (t.unreadCount > 0) badges.appendChild(el("span", "unread-dot"));
 bot.appendChild(badges);
 main.appendChild(bot);
 row.appendChild(main);
 row.addEventListener("click", function () { openThread(t); });
 list.appendChild(row);
 });
 }

 function openThread(thread) {
 state.activeConversationId = thread.conversationId;
 renderThreadList();
 var avatar = document.getElementById("chat-avatar");
 avatar.className = "avatar channel-" + thread.channel;
 avatar.textContent = initials(thread.name);
 document.getElementById("chat-name").textContent = thread.name;
 document.getElementById("chat-header-sub").textContent = thread.channel + (thread.status ? " · " + thread.status : "");
 document.getElementById("compose-bar").style.display = "flex";
 var scroll = document.getElementById("message-scroll");
 scroll.innerHTML = "<div style='color:var(--text-dim);font-size:13px;text-align:center'>Loading…</div>";
 document.getElementById("chat-placeholder") && (document.getElementById("chat-placeholder").style.display = "none");
 var qs = thread.contactId
 ? "contactId=" + encodeURIComponent(thread.contactId)
 : "conversationId=" + encodeURIComponent(thread.conversationId);
 fetchJson("/api/messages?" + qs).then(function (data) {
 scroll.innerHTML = "";
 var msgs = data.messages || [];
 if (msgs.length === 0) { scroll.appendChild(el("div", null, "No messages yet.")); return; }
 msgs.forEach(function (m) { appendMessage(m); });
 scroll.scrollTop = scroll.scrollHeight;
 var t = state.threads.find(function (x) { return x.conversationId === thread.conversationId; });
 if (t) { t.unreadCount = 0; renderThreadList(); }
 }).catch(function (err) {
 console.error("[ui] failed to load messages:", err);
 scroll.innerHTML = "<div style='color:red;font-size:13px'>Failed to load messages.</div>";
 });
 fetchJson("/api/customer?" + qs).then(function (data) {
 renderCustomer(data.customer);
 }).catch(function (err) { console.error("[ui] failed to load customer:", err); });
 }

 function appendMessage(m) {
 var scroll = document.getElementById("message-scroll");
 if (!scroll) return;
 var dir = m.direction || "inbound";
 var mtype = m.message_type || "direct";
 var bubbleCls = dir === "inbound" ? "inbound" : (mtype === "bot-cmd" ? "bot-command" : mtype === "bot-resp" ? "bot-response" : "outbound-direct");
 var row = el("div", "bubble-row " + dir);
 var bubble = el("div", "bubble " + bubbleCls, m.text || "");
 var meta = el("div", "bubble-meta", fmtTime(m.timestamp));
 bubble.appendChild(meta);
 row.appendChild(bubble);
 scroll.appendChild(row);
 }

 function flagRow(label, value) {
 var row = el("div");
 row.appendChild(document.createTextNode(label + ": "));
 var mark = el("span", value ? "flag-yes" : "flag-no", value ? "✓" : "–");
 row.appendChild(mark);
 return row;
 }

 function renderCustomer(customer) {
 var jobsCol = document.getElementById("customer-col-jobs");
 var houseCol = document.getElementById("customer-col-household");
 var propCol = document.getElementById("customer-col-property");
 jobsCol.innerHTML = "<h3>Job History</h3>";
 houseCol.innerHTML = "<h3>Household</h3>";
 propCol.innerHTML = "<h3>Property</h3>";
 if (!customer) { jobsCol.appendChild(el("div", null, "No customer record.")); return; }
 jobsCol.appendChild(el("div", null, customer.jobs && customer.jobs.lastJobDate ? "Last: " + customer.jobs.lastJobDate + " · " + (customer.jobs.lastJobService || "") + " ×" + (customer.jobs.lastJobUnits || "?") : "No jobs yet."));
 jobsCol.appendChild(el("div", null, "Total jobs: " + (customer.jobs ? customer.jobs.totalJobs : 0)));
 houseCol.appendChild(flagRow("Elderly", customer.household && customer.household.elderly));
 houseCol.appendChild(flagRow("Children", customer.household && customer.household.children));
 houseCol.appendChild(flagRow("Pets", customer.household && customer.household.pets));
 houseCol.appendChild(flagRow("Google review", customer.household && customer.household.googleReview));
 propCol.appendChild(el("div", null, (customer.property && customer.property.address) || "(no address)"));
 propCol.appendChild(el("div", null, (customer.property && customer.property.postalCode) || ""));
 propCol.appendChild(el("div", null, customer.property && customer.property.assignedTeam ? "Team: " + customer.property.assignedTeam : "No team assigned"));
 }

 function updateThreadPreview(m) {
 var existing = state.threads.find(function (t) { return t.conversationId === m.conversation_id; });
 if (!existing) return true;
 existing.lastText = m.text;
 existing.lastDirection = m.direction;
 existing.lastTimestamp = m.timestamp;
 if (m.direction === "inbound" && m.conversation_id !== state.activeConversationId) {
 existing.unreadCount = (existing.unreadCount || 0) + 1;
 }
 return false;
 }

 var composeInput = document.getElementById("compose-input");
 var composeSend = document.getElementById("compose-send");
 var composeError = document.getElementById("compose-error");

 function setComposeBusy(busy) {
 composeInput.disabled = busy;
 composeSend.disabled = busy;
 }

 function isPathBText(text) {
 return text.charAt(0) === "/" || /^(?:IN(?:BOX)?-\d+)/i.test(text);
 }

 function renderIncomingMessage(m) {
 if (!m) return;
 if (m.conversation_id === state.activeConversationId) {
 appendMessage(m);
 var scroll = document.getElementById("message-scroll");
 if (scroll) scroll.scrollTop = scroll.scrollHeight;
 }
 updateThreadPreview(m);
 }

 function sendCompose() {
 var text = composeInput.value.trim();
 if (!text || !state.activeConversationId) return;
 composeError.style.display = "none";
 setComposeBusy(true);
 var isCommand = isPathBText(text);
 var endpoint = isCommand ? "/api/command" : "/api/send";
 fetch(endpoint, {
 method: "POST",
 headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "true" },
 body: JSON.stringify({ conversationId: state.activeConversationId, text: text }),
 }).then(function (r) {
 return r.json().then(function (data) {
 if (!r.ok || !data.ok) throw new Error(data.error || ("HTTP " + r.status));
 return data;
 });
 }).then(function (data) {
 composeInput.value = "";
 composeInput.style.height = "auto";
 if (isCommand) {
 renderIncomingMessage(data.cmdMessage);
 renderIncomingMessage(data.respMessage);
 } else {
 renderIncomingMessage(data.message);
 }
 state.threads.sort(function (a, b) { return (b.lastTimestamp || 0) - (a.lastTimestamp || 0); });
 renderThreadList();
 state.lastUpdateSince = Math.max(state.lastUpdateSince, data.now);
 }).catch(function (err) {
 console.error("[ui] send failed:", err);
 composeError.textContent = isCommand ? "Command failed — try again." : "Failed to send — try again.";
 composeError.style.display = "block";
 }).finally(function () {
 setComposeBusy(false);
 composeInput.focus();
 });
 }

 composeSend.addEventListener("click", sendCompose);
 composeInput.addEventListener("keydown", function (e) {
 if (e.key === "Enter" && !e.shiftKey) {
 e.preventDefault();
 sendCompose();
 }
 });
 composeInput.addEventListener("input", function () {
 composeInput.style.height = "auto";
 composeInput.style.height = Math.min(composeInput.scrollHeight, 120) + "px";
 });

 document.getElementById("toggle-customer-panel").addEventListener("click", function () {
 var panel = document.getElementById("customer-panel");
 panel.classList.toggle("open");
 this.classList.toggle("toggled");
 });
 document.getElementById("toggle-cal-panel").addEventListener("click", function () {
 document.getElementById("cal-col").classList.toggle("collapsed");
 this.classList.toggle("toggled");
 });
 document.getElementById("thread-search").addEventListener("input", renderThreadList);

 var DOW = ["Su","Mo","Tu","We","Th","Fr","Sa"];
 function sgtDateStr(d) { return d.toLocaleDateString("en-CA", { timeZone: "Asia/Singapore" }); }

 function renderCalMonth() {
 var grid = document.getElementById("cal-grid");
 grid.innerHTML = "";
 DOW.forEach(function (d) { grid.appendChild(el("div", "cal-dow", d)); });
 var year = state.calMonth.getFullYear();
 var month = state.calMonth.getMonth();
 document.getElementById("cal-month-label").textContent = state.calMonth.toLocaleDateString([], { month: "long", year: "numeric" });
 var firstDow = new Date(year, month, 1).getDay();
 var daysInMonth = new Date(year, month + 1, 0).getDate();
 var todayStr = sgtDateStr(new Date());
 for (var i = 0; i < firstDow; i++) grid.appendChild(el("div", "cal-day empty"));
 for (var day = 1; day <= daysInMonth; day++) {
 var dateObj = new Date(year, month, day);
 var dateStr = sgtDateStr(dateObj);
 var cell = el("div", "cal-day");
 cell.textContent = String(day);
 if (dateStr === todayStr) cell.classList.add("today");
 if (dateStr === state.calSelectedDate) cell.classList.add("selected");
 cell.addEventListener("click", (function (ds) {
 return function () { state.calSelectedDate = ds; renderCalMonth(); loadCalDay(ds); };
 })(dateStr));
 grid.appendChild(cell);
 }
 }

 function loadCalDay(dateStr) {
 var listEl = document.getElementById("cal-jobs-list");
 document.getElementById("cal-jobs-heading").textContent = "Jobs — " + dateStr;
 listEl.innerHTML = "Loading…";
 fetchJson("/api/calendar?date=" + encodeURIComponent(dateStr)).then(function (data) {
 var events = data.events || [];
 listEl.innerHTML = "";
 if (events.length === 0) { var empty = el("div", null, "No jobs scheduled."); empty.id = "cal-jobs-empty"; listEl.appendChild(empty); return; }
 events.forEach(function (ev) {
 var card = el("div", "cal-job");
 var timeStr = ev.start ? new Date(ev.start).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
 card.appendChild(el("div", "cal-job-time", timeStr + " — " + (ev.customerName || ev.contactId || "Unknown")));
 var svc = [ev.serviceType, ev.units ? "×" + ev.units : null].filter(Boolean).join(" ");
 if (svc) card.appendChild(el("div", null, svc));
 card.appendChild(el("div", "cal-job-team", ev.team || ""));
 listEl.appendChild(card);
 });
 }).catch(function (err) { console.error("[ui] failed to load calendar day:", err); listEl.textContent = "Failed to load."; });
 }

 document.getElementById("cal-prev").addEventListener("click", function () { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1); renderCalMonth(); });
 document.getElementById("cal-next").addEventListener("click", function () { state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1); renderCalMonth(); });

 function poll() {
 fetchJson("/api/updates?since=" + state.lastUpdateSince).then(function (data) {
 state.lastUpdateSince = Math.max(state.lastUpdateSince, data.now);
 var messages = data.messages || [];
 if (messages.length === 0) return;
 var threadsNeedReload = false;
 messages.forEach(function (m) {
 if (m.conversation_id === state.activeConversationId) { appendMessage(m); var scroll = document.getElementById("message-scroll"); if (scroll) scroll.scrollTop = scroll.scrollHeight; }
 if (updateThreadPreview(m)) threadsNeedReload = true;
 });
 if (threadsNeedReload) { loadThreads(); } else { state.threads.sort(function (a, b) { return (b.lastTimestamp || 0) - (a.lastTimestamp || 0); }); renderThreadList(); }
