<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoolAircon CRM</title>
<style>
  :root {
    --border: #d9dde2;
    --bg-panel: #ffffff;
    --bg-app: #f0f2f5;
    --bg-hover: #f5f6f7;
    --bg-active: #e9edf3;
    --text: #1b1f23;
    --text-dim: #667085;
    --accent: #2f6fed;
    --pill-lead: #7c3aed;
    --pill-customer: #16a34a;
    --pill-booked: #d97706;
    --unread-dot: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg-app);
  }
  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ── Thread list (left) ─────────────────────────────────────────────────── */
  #thread-col {
    width: 280px;
    flex: 0 0 280px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #thread-col.collapsed { display: none; }
  #thread-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  #thread-header h1 {
    font-size: 16px;
    margin: 0 0 8px 0;
  }
  #thread-search {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  #thread-list {
    overflow-y: auto;
    flex: 1;
  }
  .thread-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 1px solid #f0f1f3;
  }
  .thread-row:hover { background: var(--bg-hover); }
  .thread-row.active { background: var(--bg-active); }
  .avatar {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 600; font-size: 14px;
  }
  .avatar.channel-telegram { background: #2f6fed; }
  .avatar.channel-whatsapp { background: #16a34a; }
  .thread-main { flex: 1; min-width: 0; }
  .thread-top-line { display: flex; justify-content: space-between; gap: 6px; }
  .thread-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thread-time { font-size: 11px; color: var(--text-dim); flex: 0 0 auto; }
  .thread-bottom-line { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 2px; }
  .thread-preview { font-size: 12.5px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .thread-badges { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
  .pill {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    color: #fff;
    white-space: nowrap;
  }
  .pill.channel-telegram { background: #2f6fed; }
  .pill.channel-whatsapp { background: #16a34a; }
  .pill.status-lead { background: var(--pill-lead); }
  .pill.status-customer { background: var(--pill-customer); }
  .pill.status-booked { background: var(--pill-booked); }
  .unread-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--unread-dot);
    flex: 0 0 auto;
  }
  #thread-empty { padding: 24px 14px; color: var(--text-dim); font-size: 13px; text-align: center; }

  /* ── Chat panel (centre) ────────────────────────────────────────────────── */
  #chat-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg-app);
  }
  #chat-header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #chat-header .avatar { width: 34px; height: 34px; font-size: 13px; }
  #chat-header-info { flex: 1; min-width: 0; }
  #chat-header-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #chat-header-sub { font-size: 12px; color: var(--text-dim); }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn.toggled { background: var(--bg-active); border-color: var(--accent); }

  #customer-panel {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    display: none;
    padding: 14px 16px;
    gap: 20px;
  }
  #customer-panel.open { display: flex; }
  #customer-panel .col { flex: 1; font-size: 12.5px; }
  #customer-panel .col h3 { margin: 0 0 6px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
  #customer-panel .col div { margin-bottom: 3px; }
  #customer-panel .flag-yes { color: var(--pill-customer); }
  #customer-panel .flag-no { color: var(--text-dim); }

  #message-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #message-empty { margin: auto; color: var(--text-dim); font-size: 13px; }
  .bubble-row { display: flex; }
  .bubble-row.align-left { justify-content: flex-start; }
  .bubble-row.align-right { justify-content: flex-end; }
  .bubble-row.align-center { justify-content: center; }
  .bubble {
    max-width: 60%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble-time { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
  .bubble.type-inbound { background: #fff; border: 1px solid var(--border); }
  .bubble.type-outbound-direct { background: var(--accent); color: #fff; }
  .bubble.type-bot-cmd { background: #e6e8eb; font-family: ui-monospace, "SF Mono", Consolas, monospace; }
  .bubble.type-bot-cmd .bubble-label { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; font-family: inherit; }
  .bubble.type-bot-resp {
    background: #eceef1;
    color: var(--text-dim);
    font-size: 12.5px;
    max-width: 75%;
    text-align: center;
  }

  #compose-banner {
    background: #fff8e6;
    border-top: 1px solid #f0dca0;
    color: #8a6d1f;
    font-size: 12.5px;
    padding: 10px 16px;
    text-align: center;
  }

  /* ── Calendar panel (right) ─────────────────────────────────────────────── */
  #cal-col {
    width: 240px;
    flex: 0 0 240px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  #cal-col.collapsed { display: none; }
  #cal-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  #cal-month-label { font-weight: 600; font-size: 13px; }
  #cal-nav button { border: none; background: none; cursor: pointer; font-size: 13px; padding: 2px 6px; }
  #cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 10px; }
  .cal-dow { font-size: 10px; color: var(--text-dim); text-align: center; }
  .cal-day {
    aspect-ratio: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 11.5px;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
  }
  .cal-day:hover { background: var(--bg-hover); }
  .cal-day.today { border: 1px solid var(--accent); }
  .cal-day.selected { background: var(--accent); color: #fff; }
  .cal-day.empty { visibility: hidden; }
  .cal-day .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); margin-top: 2px; }
  .cal-day.selected .dot { background: #fff; }
  #cal-jobs { padding: 10px 14px; border-top: 1px solid var(--border); }
  #cal-jobs h3 { font-size: 11px; text-transform: uppercase; color: var(--text-dim); margin: 0 0 8px 0; }
  .cal-job {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .cal-job .cal-job-time { font-weight: 600; }
  .cal-job .cal-job-team { color: var(--text-dim); font-size: 11px; }
  #cal-jobs-empty { color: var(--text-dim); font-size: 12px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #c7ccd3; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">

  <div id="thread-col">
    <div id="thread-header">
      <h1>KoolAircon CRM</h1>
      <input id="thread-search" type="text" placeholder="Search name or phone…">
    </div>
    <div id="thread-list"></div>
  </div>

  <div id="chat-col">
    <div id="chat-header" style="display:none;">
      <div class="avatar" id="chat-avatar"></div>
      <div id="chat-header-info">
        <div id="chat-header-name"></div>
        <div id="chat-header-sub"></div>
      </div>
      <button class="icon-btn" id="toggle-customer-panel" title="Customer info">i</button>
      <button class="icon-btn" id="toggle-cal-panel" title="Calendar">🗓</button>
    </div>

    <div id="customer-panel">
      <div class="col" id="customer-col-jobs">
        <h3>Job History</h3>
      </div>
      <div class="col" id="customer-col-household">
        <h3>Household</h3>
      </div>
      <div class="col" id="customer-col-property">
        <h3>Property</h3>
      </div>
    </div>

    <div id="message-scroll">
      <div id="message-empty">Select a conversation from the left to view its history.</div>
    </div>

    <div id="compose-banner" style="display:none;">
      Read-only preview — sending arrives in Phase 5.
    </div>
  </div>

  <div id="cal-col">
    <div id="cal-header">
      <div id="cal-nav"><button id="cal-prev">‹</button></div>
      <div id="cal-month-label"></div>
      <div id="cal-nav"><button id="cal-next">›</button></div>
    </div>
    <div id="cal-grid"></div>
    <div id="cal-jobs">
      <h3 id="cal-jobs-heading">Jobs</h3>
      <div id="cal-jobs-list"><div id="cal-jobs-empty">Select a day.</div></div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  // ── State ────────────────────────────────────────────────────────────────
  var state = {
    threads: [],
    activeConversationId: null,
    activeContactId: null,
    lastUpdateSince: 0,
    calMonth: new Date(),
    calSelectedDate: null,
  };

  // ── Helpers ──────────────────────────────────────────────────────────────
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function initials(name) {
    if (!name) return "?";
    var parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function fmtTime(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    var diffDays = Math.floor((now - d) / 86400000);
    if (diffDays < 7) return d.toLocaleDateString([], { weekday: "short" });
    return d.toLocaleDateString([], { day: "2-digit", month: "short" });
  }

  function statusPillClass(status) {
    var s = String(status || "").toLowerCase();
    if (s === "lead") return "status-lead";
    if (s === "customer") return "status-customer";
    if (s === "booked") return "status-booked";
    return "";
  }

  function fetchJson(url) {
    return fetch(url, { credentials: "same-origin" }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      return r.json();
    });
  }

  // ── Thread list ──────────────────────────────────────────────────────────
  function loadThreads() {
    return fetchJson("/api/threads").then(function (data) {
      state.threads = data.threads || [];
      renderThreadList();
    }).catch(function (err) {
      console.error("[ui] failed to load threads:", err);
    });
  }

  function renderThreadList() {
    var query = document.getElementById("thread-search").value.trim().toLowerCase();
    var list = document.getElementById("thread-list");
    list.innerHTML = "";

    var filtered = state.threads.filter(function (t) {
      if (!query) return true;
      return (t.name || "").toLowerCase().includes(query) || (t.phone || "").toLowerCase().includes(query);
    });

    if (filtered.length === 0) {
      var empty = el("div", null, state.threads.length === 0 ? "No conversations yet." : "No matches.");
      empty.id = "thread-empty";
      list.appendChild(empty);
      return;
    }

    filtered.forEach(function (t) {
      var row = el("div", "thread-row");
      row.dataset.conversationId = t.conversationId;
      if (t.conversationId === state.activeConversationId) row.classList.add("active");

      var avatar = el("div", "avatar channel-" + t.channel, initials(t.name));
      row.appendChild(avatar);

      var main = el("div", "thread-main");
      var topLine = el("div", "thread-top-line");
      topLine.appendChild(el("div", "thread-name", t.name));
      topLine.appendChild(el("div", "thread-time", fmtTime(t.lastTimestamp)));
      main.appendChild(topLine);

      var bottomLine = el("div", "thread-bottom-line");
      var previewPrefix = t.lastDirection === "outbound" ? "" : "";
      bottomLine.appendChild(el("div", "thread-preview", previewPrefix + (t.lastText || "")));

      var badges = el("div", "thread-badges");
      if (t.unreadCount > 0) badges.appendChild(el("div", "unread-dot"));
      var chanPill = el("span", "pill channel-" + t.channel, t.channel === "whatsapp" ? "WhatsApp" : "Telegram");
      badges.appendChild(chanPill);
      var statusClass = statusPillClass(t.status);
      if (statusClass) badges.appendChild(el("span", "pill " + statusClass, t.status));
      bottomLine.appendChild(badges);
      main.appendChild(bottomLine);

      row.appendChild(main);
      row.addEventListener("click", function () { openThread(t); });
      list.appendChild(row);
    });
  }

  // ── Chat panel ───────────────────────────────────────────────────────────
  function openThread(thread) {
    state.activeConversationId = thread.conversationId;
    state.activeContactId = thread.contactId;
    renderThreadList();

    document.getElementById("chat-header").style.display = "flex";
    document.getElementById("compose-banner").style.display = "block";
    document.getElementById("chat-avatar").className = "avatar channel-" + thread.channel;
    document.getElementById("chat-avatar").textContent = initials(thread.name);
    var nameEl = document.getElementById("chat-header-name");
    nameEl.innerHTML = "";
    nameEl.appendChild(document.createTextNode(thread.name + " "));
    var statusClass = statusPillClass(thread.status);
    if (statusClass) nameEl.appendChild(el("span", "pill " + statusClass, thread.status));
    document.getElementById("chat-header-sub").textContent =
      (thread.channel === "whatsapp" ? "WhatsApp" : "Telegram") + (thread.phone ? " · " + thread.phone : "");

    loadMessages(thread.conversationId);
    loadCustomer(thread);
  }

  function loadMessages(conversationId) {
    return fetchJson("/api/messages?conversationId=" + encodeURIComponent(conversationId)).then(function (data) {
      renderMessages(data.messages || []);
      var t = state.threads.find(function (x) { return x.conversationId === conversationId; });
      if (t) { t.unreadCount = 0; renderThreadList(); }
    }).catch(function (err) {
      console.error("[ui] failed to load messages:", err);
    });
  }

  function bubbleTypeFor(msg) {
    if (msg.direction === "inbound") return { cls: "type-inbound", align: "align-left" };
    if (msg.message_type === "direct") return { cls: "type-outbound-direct", align: "align-right" };
    if (msg.message_type === "bot-cmd") return { cls: "type-bot-cmd", align: "align-right" };
    return { cls: "type-bot-resp", align: "align-center" };
  }

  function renderMessages(messages) {
    var scroll = document.getElementById("message-scroll");
    scroll.innerHTML = "";
    if (messages.length === 0) {
      scroll.appendChild(el("div", null, "No messages yet."));
      scroll.firstChild.id = "message-empty";
      return;
    }
    messages.forEach(function (m) { scroll.appendChild(renderBubble(m)); });
    scroll.scrollTop = scroll.scrollHeight;
  }

  function appendMessage(m) {
    var scroll = document.getElementById("message-scroll");
    var emptyEl = document.getElementById("message-empty");
    if (emptyEl) emptyEl.remove();
    scroll.appendChild(renderBubble(m));
    scroll.scrollTop = scroll.scrollHeight;
  }

  function renderBubble(m) {
    var t = bubbleTypeFor(m);
    var row = el("div", "bubble-row " + t.align);
    var bubble = el("div", "bubble " + t.cls);
    if (t.cls === "type-bot-cmd") bubble.appendChild(el("div", "bubble-label", "via bot"));
    bubble.appendChild(document.createTextNode(m.text || ""));
    bubble.appendChild(el("div", "bubble-time", fmtTime(m.timestamp)));
    row.appendChild(bubble);
    return row;
  }

  // ── Customer info panel ─────────────────────────────────────────────────
  function loadCustomer(thread) {
    var qs = thread.contactId
      ? "contactId=" + encodeURIComponent(thread.contactId)
      : "conversationId=" + encodeURIComponent(thread.conversationId);
    fetchJson("/api/customer?" + qs).then(function (data) {
      renderCustomer(data.customer);
    }).catch(function (err) {
      console.error("[ui] failed to load customer:", err);
    });
  }

  function flagRow(label, value) {
    var row = el("div");
    row.appendChild(document.createTextNode(label + ": "));
    var mark = el("span", value ? "flag-yes" : "flag-no", value ? "✓" : "–");
    row.appendChild(mark);
    return row;
  }

  function renderCustomer(customer) {
    var jobsCol = document.getElementById("customer-col-jobs");
    var houseCol = document.getElementById("customer-col-household");
    var propCol = document.getElementById("customer-col-property");
    jobsCol.innerHTML = "<h3>Job History</h3>";
    houseCol.innerHTML = "<h3>Household</h3>";
    propCol.innerHTML = "<h3>Property</h3>";

    if (!customer) {
      jobsCol.appendChild(el("div", null, "No customer record."));
      return;
    }

    jobsCol.appendChild(el("div", null, customer.jobs.lastJobDate
      ? "Last: " + customer.jobs.lastJobDate + " · " + (customer.jobs.lastJobService || "") + " ×" + (customer.jobs.lastJobUnits || "?")
      : "No jobs yet."));
    jobsCol.appendChild(el("div", null, "Total jobs: " + customer.jobs.totalJobs));

    houseCol.appendChild(flagRow("Elderly", customer.household.elderly));
    houseCol.appendChild(flagRow("Children", customer.household.children));
    houseCol.appendChild(flagRow("Pets", customer.household.pets));
    houseCol.appendChild(flagRow("Google review", customer.household.googleReview));

    propCol.appendChild(el("div", null, customer.property.address || "(no address)"));
    propCol.appendChild(el("div", null, customer.property.postalCode || ""));
    propCol.appendChild(el("div", null, customer.property.assignedTeam ? "Team: " + customer.property.assignedTeam : "No team assigned"));
  }

  // ── Panel toggles ────────────────────────────────────────────────────────
  document.getElementById("toggle-customer-panel").addEventListener("click", function () {
    var panel = document.getElementById("customer-panel");
    panel.classList.toggle("open");
    this.classList.toggle("toggled");
  });
  document.getElementById("toggle-cal-panel").addEventListener("click", function () {
    document.getElementById("cal-col").classList.toggle("collapsed");
    this.classList.toggle("toggled");
  });

  document.getElementById("thread-search").addEventListener("input", renderThreadList);

  // ── Calendar panel ───────────────────────────────────────────────────────
  var DOW = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];

  function sgtDateStr(d) {
    return d.toLocaleDateString("en-CA", { timeZone: "Asia/Singapore" });
  }

  function renderCalMonth() {
    var grid = document.getElementById("cal-grid");
    grid.innerHTML = "";
    DOW.forEach(function (d) { grid.appendChild(el("div", "cal-dow", d)); });

    var year = state.calMonth.getFullYear();
    var month = state.calMonth.getMonth();
    document.getElementById("cal-month-label").textContent =
      state.calMonth.toLocaleDateString([], { month: "long", year: "numeric" });

    var firstDow = new Date(year, month, 1).getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var todayStr = sgtDateStr(new Date());

    for (var i = 0; i < firstDow; i++) grid.appendChild(el("div", "cal-day empty"));

    for (var day = 1; day <= daysInMonth; day++) {
      var dateObj = new Date(year, month, day);
      var dateStr = sgtDateStr(dateObj);
      var cell = el("div", "cal-day");
      cell.textContent = String(day);
      if (dateStr === todayStr) cell.classList.add("today");
      if (dateStr === state.calSelectedDate) cell.classList.add("selected");
      cell.addEventListener("click", (function (ds, cellEl) {
        return function () {
          state.calSelectedDate = ds;
          renderCalMonth();
          loadCalDay(ds);
        };
      })(dateStr, cell));
      grid.appendChild(cell);
    }
  }

  function loadCalDay(dateStr) {
    var listEl = document.getElementById("cal-jobs-list");
    document.getElementById("cal-jobs-heading").textContent = "Jobs — " + dateStr;
    listEl.innerHTML = "Loading…";
    fetchJson("/api/calendar?date=" + encodeURIComponent(dateStr)).then(function (data) {
      var events = data.events || [];
      listEl.innerHTML = "";
      if (events.length === 0) {
        listEl.appendChild(el("div", null, "No jobs scheduled."));
        listEl.firstChild.id = "cal-jobs-empty";
        return;
      }
      events.forEach(function (ev) {
        var card = el("div", "cal-job");
        var timeStr = ev.start ? new Date(ev.start).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
        card.appendChild(el("div", "cal-job-time", timeStr + " — " + (ev.customerName || ev.contactId || "Unknown")));
        var svc = [ev.serviceType, ev.units ? "×" + ev.units : null].filter(Boolean).join(" ");
        if (svc) card.appendChild(el("div", null, svc));
        card.appendChild(el("div", "cal-job-team", ev.team || ""));
        listEl.appendChild(card);
      });
    }).catch(function (err) {
      console.error("[ui] failed to load calendar day:", err);
      listEl.textContent = "Failed to load.";
    });
  }

  document.getElementById("cal-prev").addEventListener("click", function () {
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() - 1, 1);
    renderCalMonth();
  });
  document.getElementById("cal-next").addEventListener("click", function () {
    state.calMonth = new Date(state.calMonth.getFullYear(), state.calMonth.getMonth() + 1, 1);
    renderCalMonth();
  });

  // ── Live updates (long-poll) ────────────────────────────────────────────
  function poll() {
    fetchJson("/api/updates?since=" + state.lastUpdateSince).then(function (data) {
      state.lastUpdateSince = data.now;
      var messages = data.messages || [];
      if (messages.length === 0) return;

      var threadsNeedReload = false;
      messages.forEach(function (m) {
        if (m.conversation_id === state.activeConversationId) {
          appendMessage(m);
        }
        var existing = state.threads.find(function (t) { return t.conversationId === m.conversation_id; });
        if (existing) {
          existing.lastText = m.text;
          existing.lastDirection = m.direction;
          existing.lastTimestamp = m.timestamp;
          if (m.direction === "inbound" && m.conversation_id !== state.activeConversationId) {
            existing.unreadCount = (existing.unreadCount || 0) + 1;
          }
        } else {
          threadsNeedReload = true;
        }
      });

      if (threadsNeedReload) {
        loadThreads();
      } else {
        state.threads.sort(function (a, b) { return (b.lastTimestamp || 0) - (a.lastTimestamp || 0); });
        renderThreadList();
      }
    }).catch(function (err) {
      console.error("[ui] poll failed:", err);
    }).finally(function () {
      setTimeout(poll, 3000);
    });
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  state.lastUpdateSince = Date.now();
  loadThreads();
  renderCalMonth();
  setTimeout(poll, 3000);
})();
</script>
</body>
</html>
